name: Build Android App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK & Build Tools
      run: |
        sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"

    - name: Make Gradle executable
      run: chmod +x ./gradlew

    - name: Build with Gradle
      run: ./gradlew assembleRelease

    - name: Pack Magisk Module Zip
      run: |
        echo "[*] Creating Magisk Module Structure..."
        mkdir -p RevenyZygisk/META-INF/com/google/android
        mkdir -p RevenyZygisk/system/lib64
        
        echo "[*] Copying Compiled Binaries..."
        find . -name "libreveny.so" -type f -exec cp {} RevenyZygisk/system/lib64/ \;
        
        echo "[*] Creating STRICT module.prop (NO SPACES ALLOWED)..."
        echo "id=reveny_zygisk" > RevenyZygisk/module.prop
        echo "name=Reveny Zygisk Mod" >> RevenyZygisk/module.prop
        echo "version=v1.0" >> RevenyZygisk/module.prop
        echo "versionCode=1" >> RevenyZygisk/module.prop
        echo "author=Reveny" >> RevenyZygisk/module.prop
        echo "description=A Zygisk module built automatically" >> RevenyZygisk/module.prop
        
        echo "[*] Creating Magisk installer scripts..."
        # #MAGISK tag is required for Magisk to recognize and auto-install it properly
        echo "#MAGISK" > RevenyZygisk/META-INF/com/google/android/update-binary
        chmod +x RevenyZygisk/META-INF/com/google/android/update-binary
        touch RevenyZygisk/META-INF/com/google/android/updater-script
        
        echo "[*] Zipping the clean module..."
        cd RevenyZygisk
        zip -r9 ../Reveny_Zygisk_Flashable.zip .
        cd ..

    - name: Upload Module Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Magisk-Module-Zip
        path: Reveny_Zygisk_Flashable.zip
        
