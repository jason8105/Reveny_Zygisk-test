name: Build Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK & Build Tools
      run: |
        sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"

    - name: Make Gradle executable
      run: chmod +x ./gradlew

    - name: Build with Gradle
      run: ./gradlew assembleRelease

    - name: Pack Magisk Module Zip
      run: |
        echo "[*] Creating Magisk Module Structure..."
        mkdir -p RevenyZygisk
        mkdir -p RevenyZygisk/META-INF/com/google/android
        mkdir -p RevenyZygisk/system/lib64
        
        echo "[*] Copying Compiled Binaries..."
        # Extract the compiled .so from build output directly to the new structure
        find . -name "libreveny.so" -type f -exec cp {} RevenyZygisk/system/lib64/ \;
        
        echo "[*] Creating module.prop..."
        cat << 'EOF' > RevenyZygisk/module.prop
        id=reveny_zygisk
        name=Reveny Zygisk Mod
        version=v1.0
        versionCode=1
        author=Reveny
        description=A Zygisk module for Reveny automatically built via GitHub Actions
        EOF
        
        echo "[*] Creating update-binary and updater-script..."
        cat << 'EOF' > RevenyZygisk/META-INF/com/google/android/updater-script
        ui_print("******************************");
        ui_print(" Reveny Zygisk Module ");
        ui_print("******************************");
        set_perm_recursive(0, 0, 0755, 0644, $MODPATH/system);
        ui_print("Installation Complete!");
        EOF
        
        echo "#!/sbin/sh" > RevenyZygisk/META-INF/com/google/android/update-binary
        echo "unzip -o \"\$3\" 'META-INF/com/google/android/updater-script' -d /tmp" >> RevenyZygisk/META-INF/com/google/android/update-binary
        echo "package_extract_dir update /tmp" >> RevenyZygisk/META-INF/com/google/android/update-binary
        chmod +x RevenyZygisk/META-INF/com/google/android/update-binary
        
        echo "[*] Zipping the clean module..."
        cd RevenyZygisk && zip -r9 ../Reveny_Zygisk_Flashable.zip .
        cd ..

    - name: Upload Module Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Magisk-Module-Zip
        path: Reveny_Zygisk_Flashable.zip
        
