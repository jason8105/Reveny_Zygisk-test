name: Build Android App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK & Build Tools
      run: |
        sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"

    - name: Make Gradle executable
      run: chmod +x ./gradlew

    - name: Build with Gradle
      run: ./gradlew assembleRelease

    - name: Prepare Magisk Module Files
      run: |
        echo "[*] Creating Magisk Module Structure..."
        mkdir -p MagiskModule/META-INF/com/google/android
        mkdir -p MagiskModule/system/lib64
        
        echo "[*] Copying Compiled Binaries..."
        find . -name "libreveny.so" -type f -exec cp {} MagiskModule/system/lib64/ \;
        
        echo "[*] Creating STRICT module.prop..."
        echo "id=reveny_zygisk" > MagiskModule/module.prop
        echo "name=Reveny Zygisk Mod" >> MagiskModule/module.prop
        echo "version=v1.0" >> MagiskModule/module.prop
        echo "versionCode=1" >> MagiskModule/module.prop
        echo "author=Reveny" >> MagiskModule/module.prop
        echo "description=A Zygisk module built automatically" >> MagiskModule/module.prop
        
        echo "[*] Creating Magisk installer scripts..."
        echo "#MAGISK" > MagiskModule/META-INF/com/google/android/update-binary
        chmod +x MagiskModule/META-INF/com/google/android/update-binary
        touch MagiskModule/META-INF/com/google/android/updater-script

    - name: Upload Module Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Reveny_Zygisk_Flashable
        # Yahan hum seedha folder de rahe hain, ab koi double zip ka chakkar nahi hoga
        path: MagiskModule/
        
